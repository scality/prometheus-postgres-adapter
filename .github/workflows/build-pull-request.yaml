name: Build

on:
  pull_request:

env:
  platforms: linux/amd64
  image_tag: ${{ github.head_ref }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate short SHA
        id: sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}-${{ steps.sha.outputs.sha }}
          tags: |
            prometheus-postgres-adapter:pr-${{ github.event.pull_request.number }}
            prometheus-postgres-adapter:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
