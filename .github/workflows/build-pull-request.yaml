name: Build

on:
  pull_request:
  release:
    types: [published]

env:
  platforms: linux/amd64
  image_tag: ${{ github.head_ref }}
  builder_image: golang:1.24
  runner_image: gcr.io/distroless/static-debian12

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate short SHA
        id: sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APPLICATION_VERSION=pr-${{ github.event.pull_request.number }}-${{ steps.sha.outputs.sha }}
            BUILDER_IMAGE=${{ env.builder_image }}
            RUNNER_IMAGE=${{ env.runner_image }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
